# Publishes to npm when a version tag is pushed.
#
# Authentication is OIDC Trusted Publishing: npm trusts this workflow in this
# repository, so there is no long-lived token to store or renew. The same
# exchange signs a provenance attestation, which lets anyone verify the package
# was built here, from this commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# On npmjs.com, open the package settings for statable-analytics:
#   Trusted Publisher → Select your publisher → GitHub Actions
#     Organization or user: key-arg
#     Repository:           statable-analytics
#     Workflow filename:    publish.yml
#     Environment name:     (leave empty)
#     Allowed actions:      tick "Allow npm publish"
#
# Without that tick the publisher may only stage a release, and this workflow
# fails. The fields are fixed once saved; changing them means deleting the
# connection and creating a new one.
#
# ─── RELEASING ─────────────────────────────────────────────────────────────────
#
#   npm version patch       # or minor / major, commits and tags
#   git push --follow-tags
#
# `npm version` writes tags with a "v" prefix, which the filter below matches.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token npm exchanges for publish rights,
      # and to sign the provenance attestation.
      id-token: write
      # Least privilege: the workflow only reads the repository.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1 or newer; Node LTS still ships 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs the build and the tests, so a broken package
      # cannot reach the registry. This keeps the failure visible as its own
      # step rather than buried in the publish output.
      - name: Type check
        run: npm run typecheck

      - name: Publish
        run: npm publish --provenance --access public
